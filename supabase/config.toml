# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init` (quedaba "app", el nombre de la carpeta
# local -- sin relación con los proyectos remotos "App"/"App_dev"). INFRA-010: nombre estable del
# proyecto en este repositorio.
project_id = "extendiendoservicios-app"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Controls whether new tables, views, sequences and functions created in the `public` schema by
# `postgres` are reachable through the Data API roles (`anon`, `authenticated`, `service_role`)
# without explicit GRANTs, matching the cloud default. Set to `false` to require explicit GRANTs
# instead. Left unset, a fresh project falls back to `true`.
# auto_expose_new_tables = true

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
# INFRA-010: verificado contra `supabase projects list` -- App y App_dev corren Postgres 17.6 (17.6.1.166).
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
# Sin declarar (fuera de este encargo, INFRA-011 es solo Auth): `config push` dejaría estos dos
# valores sin tocar en App_dev (hoy 15 / 200) si no se declaran acá.
# default_pool_size = 20
# Maximum number of client connections allowed.
# max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files, directories, or glob patterns that describe your database.
# Supports paths relative to supabase directory: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
# Sin declarar (fuera de este encargo: no forma parte del plan). Queda como esté hoy en App_dev.
# [storage.vector]
# enabled = true
# max_buckets = 10
# max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# INFRA-011 (02_Decisiones.md P-111, P-015): valores de este bloque para App_dev. La sección
# [remotes.produccion.auth] al final del archivo trae los overrides de App -- ver docs/environments.md.
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "https://dev.extendiendoservicios.com"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# App_dev: local (Vite) y el subdominio de staging, cada uno con la ruta /restablecer (COM-03,
# `05_Pantallas_y_Navegacion.md` línea 139) que usa el enlace de recuperación de contraseña.
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/restablecer",
  "https://dev.extendiendoservicios.com",
  "https://dev.extendiendoservicios.com/restablecer",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
# P-015: JWT de 1 hora, renovado en segundo plano con el refresh token.
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
# P-015: sesión persistente. La rotación queda habilitada (valor recomendado por Supabase); no hay
# expiración del refresh token por tiempo (no se declara [auth.sessions].timebox ni
# inactivity_timeout más abajo, que por omisión quedan sin límite).
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
# Valor recomendado por Supabase (ventana de gracia ante reintentos de red).
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
# P-011: sin registro público. Los usuarios los crea el dueño o un administrador (pantalla de
# usuarios o Edge Function `admin-users` con la Admin API) -- ver ADR-005, ADR-008.
enable_signup = false
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
# P-106: mínimo 8 caracteres, sin otras reglas.
minimum_password_length = 8
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
# P-106: sin reglas de composición además del largo mínimo.
password_requirements = ""

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# P-107: rate limiting por defecto de Supabase, sin cambios (no hay bloqueo propio por cuenta),
# salvo email_sent de abajo, que P06.0 sube porque deja de ser un valor inerte.
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
#
# P06.0: con el SMTP de Resend habilitado más abajo, este valor pasa a regir de verdad (antes,
# sin `auth.email.smtp` encendido, Supabase lo ignoraba). El plan gratis de Resend permite 100
# emails por día y 3000 por mes -- sin límite propio por hora -- y acá el único uso de Auth es
# recuperación de contraseña (COM-02, P-012) y el cambio de email de login, que hace un
# administrador desde ADM-27 por la Edge Function `admin-users` (nadie lo cambia por su cuenta:
# en COM-04 el email de login es de solo lectura), sobre
# una base de unos sesenta usuarios. Con el valor anterior (2/hora, heredado de la plantilla)
# alcanzaba para dos personas por hora en todo el proyecto: la tercera que pidiera un reseteo en
# esa misma hora se quedaba sin correo y sin ningún aviso de por qué. 20/hora le da margen a
# cualquier pico real (por ejemplo, varios empleados reseteando contraseña el mismo día) sin
# acercarse al límite diario de Resend salvo que ese ritmo se sostenga varias horas seguidas, lo
# que en la práctica sería un patrón de abuso, no un uso legítimo -- ahí el límite diario del
# proveedor termina de frenarlo.
#
# OJO con la documentación previa de este repositorio (`docs/environments.md` decía que esta
# propiedad era "unmanaged" y que la CLI no la pushea): eso era cierto solo mientras nadie la
# declaraba acá -- sin un valor local, la CLI la listaba como "unmanaged" (ni se compara). Al
# declararla, `config push` SÍ la aplicó de verdad contra App_dev (verificado en vivo el 22 sep
# 2026: el push la incluyó en `secrets/changes` de `auth` con status "updated", y el `config
# diff` posterior ya no la mostró como diferencia). No hace falta tocar el panel a mano.
email_sent = 20
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
#
# OJO, no es lo que parece por el nombre (verificado en vivo contra App_dev el 22 sep 2026):
# en esta versión de la CLI, esta propiedad gobierna el INTERRUPTOR DEL PROVEEDOR EMAIL del
# panel (`external_email_enabled`), no el registro público. Con `false`, Auth rechaza todo
# inicio de sesión con `Email logins are disabled`, que es lo que pasó cuando un `config push`
# la aplicó sobre App_dev y dejó la aplicación sin login.
#
# Quien garantiza P-011 (sin registro público por ningún método) es `enable_signup = false` del
# bloque [auth] de arriba, que es el global: con eso, `/auth/v1/settings` devuelve
# `disable_signup: true` y nadie se puede registrar solo. Las cuentas las crea siempre un
# administrador por la Admin API (Edge Function `admin-users`, F7) o el seed.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
#
# P06.0: se declara en `false` (autoconfirmar), a propósito y en contra del valor que trae hoy
# App_dev (`true`, verificado con `config diff` antes de este cambio). P-011 es explícito: el
# alta la hace siempre el dueño o un administrador desde la pantalla de usuarios, con una
# contraseña inicial que le entrega a la persona por fuera del sistema, "no hay cambio
# obligatorio al primer ingreso" -- no hay ningún paso de invitación ni de confirmación por
# correo en ese flujo (ADR-005 lo dice explícito: "la invitación por email contradice P-011").
#
# Con `enable_confirmations = true`, un usuario recién creado por la Edge Function `admin-users`
# (F7, todavía no existe) quedaría sin poder iniciar sesión hasta hacer clic en un enlace de un
# correo que el flujo de P-011 ni siquiera contempla enviar, salvo que esa función pase
# `email_confirm: true` explícito al crear la cuenta con la Admin API -- un detalle de
# implementación futura del que hoy no hay garantía. Declararlo acá en `false` hace que la alta
# funcione según lo decidido sin depender de que ese detalle se implemente bien, y evita
# consumir el rate limit de email_sent de arriba con un correo que nadie pidió.
enable_confirmations = false
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
secure_password_change = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
# Sin declarar (ligado a SMTP, fuera de este encargo).
# max_frequency = "1s"
# Number of characters used in the email OTP.
# Sin declarar (ligado a SMTP, fuera de este encargo).
# otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
#
# P06.0 / ADR-022: SMTP de Resend para App_dev. El dominio `extendiendoservicios.com` ya está
# verificado en Resend (SPF, DKIM y DMARC publicados) y el remitente es
# `no-reply@extendiendoservicios.com`.
#
# La clave sale de `env(RESEND_API_KEY)`, que la CLI resuelve leyendo `app/supabase/.env` (el
# `.env` de DENTRO de esta carpeta, no el de la raíz del proyecto ni un `.env.local`) o el
# entorno del proceso si ya está exportada ahí -- verificado en vivo contra App_dev el 22 sep
# 2026, no documentado como tal en la referencia de la CLI. Ver `supabase/.env.example` y
# `docs/environments.md` sección 4.
#
# TRAMPA, verificada en vivo el 22 sep 2026: si `RESEND_API_KEY` no está definida en ninguno de
# esos dos lugares cuando se corre `config push`, la CLI NO FALLA -- empuja el texto literal
# `env(RESEND_API_KEY)` como si fuera la contraseña real. Auth queda con una contraseña de SMTP
# que no es ninguna contraseña, todos los envíos de correo empiezan a fallar, y no hay ningún
# error visible en el push que lo delate (mismo patrón que el incidente de P04.9, cuando un
# `config push` apagó el proveedor Email de staging sin que nadie lo notara hasta después).
# Antes de cualquier `config push` que toque este bloque, confirmar que la variable existe
# (`grep -c RESEND_API_KEY supabase/.env`, sin imprimir el valor) y, después del push, comprobar
# de verdad que un correo sale (o, como mínimo, que `/auth/v1/settings` sigue con el proveedor
# Email habilitado).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
# Puerto 587 (STARTTLS), no 465: es el que Resend recomienda como el más estándar y compatible
# para un cliente SMTP genérico (su documentación soporta 25/465/587/2465/2587, pero destaca 587
# como el de uso normal; 465 es TLS implícito, para clientes que no saben hacer STARTTLS).
port = 587
# Usuario literal "resend" -- no es una cuenta ni un email, así lo pide Resend para SMTP: la
# autenticación real es la contraseña, que es la clave de la API.
user = "resend"
pass = "env(RESEND_API_KEY)"
# Remitente de los correos de Auth (ADR-022). `no-reply` porque nadie va a leer las respuestas:
# la recuperación de contraseña y el cambio de email no esperan una respuesta por correo.
admin_email = "no-reply@extendiendoservicios.com"
# Nombre que ve el empleado en su bandeja de entrada junto al remitente. El nombre de la empresa
# a secas, sin adornos ("Soporte", "No responder", etc.): es lo que más rápido reconoce alguien
# que no espera un correo de este sistema y que puede dudar si es legítimo.
sender_name = "Extendiendo Servicios"

# AUTH-005 / ADR-022: plantillas propias en español con voseo, en vez de la
# plantilla genérica en inglés que trae Supabase por defecto (la que llegó
# con el primer correo real de prueba de P06.0). Cada bloque declara solo
# `subject` (usado también por `config diff`, que compara nada más que
# eso) y `content_path`, el HTML completo en `supabase/templates/`.
#
# `recovery`: la única que se dispara hoy -- la usa COM-02 (P-012) cuando
# alguien se olvidó la contraseña.
[auth.email.template.recovery]
subject = "Restablecé tu contraseña de Extendiendo Servicios"
content_path = "./supabase/templates/recovery.html"

# `email_change`: hoy no se dispara -- el cambio de email de login lo hace
# un administrador desde ADM-27 por la Edge Function `admin-users` con la
# Admin API, que no manda este correo. Se declara igual como red: si algún
# día se dispara (por un cambio en esa función o por cualquier otro uso
# futuro de este flujo de Auth), que no salga en inglés con la plantilla
# genérica.
[auth.email.template.email_change]
subject = "Confirmá tu nuevo email de acceso a Extendiendo Servicios"
content_path = "./supabase/templates/email_change.html"

# Sin declarar (fuera de este encargo): `confirmation` (no se usa,
# `enable_confirmations = false` arriba), `invite` (no hay invitaciones,
# P-011 y ADR-005) y `magic_link` (ADR-008 descartó OTP). La notificación
# `password_changed` sigue apagada -- encenderla es otra decisión, no de
# AUTH-005.
#
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./supabase/templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# P-015: sesión persistente sin límite por tiempo ni por inactividad -- se deja sin declarar
# a propósito (omitir la sección es la forma de no imponer ninguno de los dos límites).
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# DB-004 (04_Modelo_de_Datos.md sección 7.1): agrega los claims "roles" y "capabilities" al JWT.
# `<database>` es "postgres" en todo proyecto Supabase hospedado (App y App_dev incluidos); el
# esquema es `app` (04 sección 0: funciones auxiliares de permisos), no `public`. Los grants que
# la función necesita (supabase_auth_admin puede ejecutarla; authenticated/anon/public no)
# están en supabase/migrations/0003_profiles_roles_capabilities.sql, junto a la función.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token_hook"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
# Sin declarar: ADR-008 descartó OTP por SMS, no forma parte del plan. Queda como esté hoy en App_dev.
# [auth.sms.twilio]
# enabled = false
# account_sid = ""
# message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
# auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
# Sin declarar (MFA no forma parte de este encargo ni del plan actual). Queda como esté hoy en App_dev.
# [auth.mfa.totp]
# enroll_enabled = false
# verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta is the schema diff engine for db diff / db pull / db remote commit.
# Set enabled = false to fall back to the legacy migra engine.
[experimental.pgdelta]
enabled = true
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./schemas"
# JSON string passed through to pg-delta SQL formatting. When omitted, SQL is
# formatted with uppercase keywords, indent 2, max width 180, trailing commas,
# and column/key alignment. Set to "null" to emit raw, unformatted SQL.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":180,\"commaStyle\":\"trailing\"}"

# ---------------------------------------------------------------------------
# INFRA-010 / INFRA-011 -- override para el proyecto de producción "App"
# ---------------------------------------------------------------------------
# Todo lo de arriba se pushea hoy solo a App_dev (ref anesttvrnpsaaaxaquce, org
# bpcfjqvpdfmepiohltbz), el único proyecto vinculado localmente (docs/environments.md). Este
# bloque documenta, sin aplicarlo, el override de Auth para "App" (producción, ref
# fysuppdadwvabrjpnnoh): mismas reglas que App_dev (sin registro público, contraseña mínima 8,
# JWT de 1 hora, refresh token sin expiración, rate limiting por defecto, SMTP de Resend,
# enable_confirmations) salvo el dominio y la clave de SMTP (abajo, propia de producción).
# `supabase config push` toma los valores no declarados acá del bloque raíz de arriba.
#
# Este repositorio NUNCA ejecuta `supabase link` ni `config push` contra este ref: "App" se toca
# solo desde CI con secretos y con aprobación de Mike (ver docs/environments.md). El comando que
# Mike correría a mano está documentado ahí mismo.
[remotes.produccion]
project_id = "fysuppdadwvabrjpnnoh"

[remotes.produccion.auth]
site_url = "https://app.extendiendoservicios.com"
additional_redirect_urls = [
  "https://app.extendiendoservicios.com",
  "https://app.extendiendoservicios.com/restablecer",
]

# P06.0: override del SMTP para producción. Misma configuración que App_dev (mismo dominio
# verificado, mismo remitente, mismo puerto) salvo la clave: Resend tiene una clave de API
# separada por proyecto ("supabase-auth-prod", ya generada -- la tiene Mike), así que referencia
# una variable de entorno DISTINTA (`RESEND_API_KEY_PROD`, no `RESEND_API_KEY`): así un push
# contra producción no puede terminar usando la clave de App_dev por descuido, y cada entorno
# conserva su propia clave rotable por separado. Mike la carga en
# `app/supabase/.env` (junto a `RESEND_API_KEY`, como una línea más) recién cuando F6 pase a
# producción y corresponda ejecutar el `config push` contra `App` -- ver docs/environments.md
# sección 3 y sección 4 para el nombre y el paso a paso. Nada de esto se aplica desde acá.
[remotes.produccion.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY_PROD)"
admin_email = "no-reply@extendiendoservicios.com"
sender_name = "Extendiendo Servicios"
