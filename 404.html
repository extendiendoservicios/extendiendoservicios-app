<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extendiendo Servicios — Plataforma</title>
<meta name="description" content="Plataforma de gestión de Extendiendo Servicios — en construcción.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1017">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Extendiendo Servicios — Plataforma">
<meta property="og:description" content="Plataforma de gestión de Extendiendo Servicios — en construcción.">
<meta property="og:url" content="https://app.extendiendoservicios.com/">
<meta property="og:image" content="https://app.extendiendoservicios.com/logo.png">
<meta property="og:locale" content="es_AR">
<link rel="canonical" href="https://app.extendiendoservicios.com/">
<style>
  :root{
    --primary:#569EA4;
    --bg:#0E1017;
    --text:#EEF2F5;
    --muted:#8D97A8;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:40px 24px;
    background:var(--bg);
    background-image:radial-gradient(62% 52% at 50% 38%, rgba(86,158,164,.15) 0%, rgba(14,16,23,0) 72%);
    color:var(--text);
    font-family:"Inter","Segoe UI",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:560px;
    width:100%;
    animation:rise .75s cubic-bezier(.22,.61,.36,1) both;
  }

  .logo{
    width:clamp(230px,58vw,420px);
    height:auto;
    display:block;
  }

  .status{
    margin:clamp(30px,5.5vw,44px) 0 0;
    font-size:clamp(1rem,2.8vw,1.15rem);
    font-weight:500;
    letter-spacing:.01em;
    display:inline-flex;
    align-items:center;
    gap:11px;
  }

  .dot{
    width:7px;height:7px;flex:0 0 7px;
    border-radius:50%;
    background:var(--primary);
    animation:pulse 2.4s ease-in-out infinite;
  }

  .note{
    margin:12px 0 0;
    font-size:clamp(.85rem,2.3vw,.925rem);
    line-height:1.5;
    color:var(--muted);
  }

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" width="800" height="670" alt="Extendiendo Servicios">
    <p class="status"><span class="dot" aria-hidden="true"></span>Plataforma en construcción</p>
    <p class="note">El acceso a la plataforma estará disponible próximamente.</p>
  </main>
</body>
</html>
