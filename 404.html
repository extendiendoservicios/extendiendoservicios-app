<style>
  :root{
    --primary:#569EA4;
    --ink:#13151E;
    --muted:#4A5061;
    --bg:#F6F7F9;
    --glow:rgba(86,158,164,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F2F5F7;
      --muted:#98A1B2;
      --bg:#0E1017;
      --glow:rgba(86,158,164,.20);
    }
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:32px 24px;
    background:var(--bg);
    background-image:radial-gradient(60% 55% at 50% 34%, var(--glow) 0%, rgba(0,0,0,0) 70%);
    color:var(--ink);
    font-family:"Inter","Segoe UI",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:640px;
    width:100%;
    animation:rise .7s cubic-bezier(.22,.61,.36,1) both;
  }

  .mark{
    width:clamp(122px,26vw,188px);
    height:auto;
    fill:currentColor;
    display:block;
  }

  h1{
    margin:clamp(22px,4.4vw,34px) 0 0;
    font-family:"Oswald","Archivo Narrow","Segoe UI",sans-serif;
    font-weight:600;
    font-size:clamp(1.3rem,5.4vw,2.7rem);
    line-height:1.05;
    letter-spacing:.16em;
    text-transform:uppercase;
    /* la ultima letra arrastra el tracking: se compensa desplazando el bloque */
    text-indent:.16em;
  }

  .lockup{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    max-width:100%;
  }

  .rule{
    width:100%;
    height:4px;
    margin:clamp(12px,2.2vw,17px) 0 0;
    border-radius:999px;
    background:var(--primary);
    transform-origin:center;
    animation:grow .8s .18s cubic-bezier(.22,.61,.36,1) both;
  }

  .status{
    margin:clamp(26px,5vw,38px) 0 0;
    font-size:clamp(.95rem,2.6vw,1.075rem);
    font-weight:500;
    letter-spacing:.02em;
    color:var(--muted);
    display:inline-flex;
    align-items:center;
    gap:10px;
  }

  .dot{
    width:7px;height:7px;flex:0 0 7px;
    border-radius:50%;
    background:var(--primary);
    animation:pulse 2.4s ease-in-out infinite;
  }

  .note{
    margin:10px 0 0;
    font-size:clamp(.8rem,2.2vw,.875rem);
    color:var(--muted);
    opacity:.75;
  }

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
