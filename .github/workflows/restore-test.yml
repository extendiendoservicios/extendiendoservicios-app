name: Restore test

# INFRA-018/INFRA-024 (ADR-015, TEST-024): restauración de prueba de un respaldo de R2 en
# App_dev. Solo workflow_dispatch, con una confirmación explícita: no corre nunca por cron ni por
# push. La guía clic por clic, el acta de la prueba y la recuperación de App_dev están en
# docs/restore-test.md; el diseño completo, en docs/deployment.md sección 6.3.
#
# CUÁNDO CORRERLO: en una ventana en la que nadie use App_dev (las suites e2e, el CI con cambios
# en supabase/ y los despliegues a staging también escriben ahí) y sabiendo que al terminar
# App_dev queda SIN usuarios y SIN datos de prueba: se recupera con scripts/recuperar-app-dev.ts.
# Corre en unos 3 minutos.
#
# EL BOTÓN "Run workflow": GitHub solo lo ofrece para workflows que ya existen en la rama por
# defecto (`main`), y corre la versión del archivo de la rama que se elija en el desplegable
# "Use workflow from". Hoy `main` ya tiene este archivo (pase 0.14.0), así que el botón aparece;
# para probar una versión más nueva que todavía no llegó a `main`, se elige `develop`.
#
# SOLO App_dev. Este workflow no referencia SUPABASE_DB_URL_PROD en ningún paso ni en ningún
# `env:`: la restauración la ejecuta scripts/restore-from-r2.sh, que tampoco la lee (ver el
# encabezado de ese script). Restaurar App (producción) es un procedimiento manual y excepcional
# aparte (docs/runbook-produccion.md), nunca este workflow ni ese script.
#
# ALCANCE y decisiones de Mike (19 sep 2026): se restaura el esquema "public" MÁS los usuarios de
# auth (auth.users, auth.identities) -- no la estructura de "auth", solo esas filas -- porque
# public tiene claves foráneas reales hacia auth.users. Van a pasar datos personales y HASHES DE
# CONTRASEÑA reales de producción por App_dev mientras dura la prueba: "dev." NO es un entorno
# seguro en esos minutos. Por eso el propio script borra todo lo que restauró antes de terminar
# (paso "Bajar, descifrar, restaurar..." de más abajo), y este workflow además corre un paso
# `if: always()` que confirma que quedó vacío, corra lo que corra en el paso anterior.
#
# QUÉ VERIFICA (detalle en el encabezado del script): que el volcado sea un respaldo completo,
# que App_dev tenga las mismas migraciones, filas idénticas tabla por tabla, claves foráneas sin
# huérfanas, estructura y permisos intactos (sin el GRANT ALL por defecto de Supabase), y una
# sesión simulada de una persona owner/admin con el hook de Auth y la RLS. El resultado queda en
# la pestaña "Summary" de la corrida, que es el insumo del acta de docs/restore-test.md.

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: >-
          Escribí exactamente restaurar-app-dev para confirmar. Durante unos minutos, este
          workflow reemplaza el esquema public y los usuarios de auth de App_dev con el
          contenido del respaldo elegido (datos personales y hashes reales incluidos) y los
          borra de nuevo al terminar.
        required: true
        type: string
      objeto_r2:
        description: >-
          Clave del objeto en R2 (por ejemplo diarios/App_20260101_030000.dump.gpg). Si lo dejás
          vacío, se usa el respaldo más reciente con prefijo diarios/.
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Mismo grupo que e2e-app-dev.yml: la restauración vacía App_dev y las suites e2e lo usan; así
# GitHub nunca corre las dos a la vez.
concurrency:
  group: e2e-app-dev
  cancel-in-progress: false

jobs:
  restore-test:
    name: Restaurar un respaldo en App_dev (public + usuarios de auth), verificar y limpiar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # El checkout va primero (antes de validar la confirmación) para que
      # scripts/restore-from-r2.sh exista en el runner pase lo que pase, y el paso final
      # `if: always()` pueda correr incluso si la confirmación no coincidió.
      - name: Descargar el código (scripts/restore-from-r2.sh y scripts/lib/)
        uses: actions/checkout@v7

      - name: Verificar la confirmación
        id: confirmar
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "restaurar-app-dev" ]; then
            echo "::error::La confirmación no es exactamente 'restaurar-app-dev': se aborta sin tocar nada."
            exit 1
          fi

      - name: Bajar, descifrar, restaurar (public + auth.users/auth.identities), verificar y limpiar
        env:
          OBJETO_R2: ${{ inputs.objeto_r2 }}
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$OBJETO_R2" ]; then
            scripts/restore-from-r2.sh --ultimo restaurar-app-dev
          else
            scripts/restore-from-r2.sh "$OBJETO_R2" restaurar-app-dev
          fi

      # Corre siempre (haya salido bien o mal el paso anterior), salvo que la confirmación escrita
      # no haya coincidido: en ese caso no se tocó nada y App_dev conserva sus datos de antes.
      - name: Confirmar que App_dev quedó vacío
        if: always() && steps.confirmar.conclusion == 'success'
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: scripts/restore-from-r2.sh --confirmar-vacio
